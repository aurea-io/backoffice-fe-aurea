name: Build and deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/aurea-io/backoffice-fe-aurea
  CONTAINER_NAME: aurea-frontend
  APP_PORT: '80'

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  publish:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AUREA_COMMIT_ID=${{ github.sha }}
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy frontend to Vercel
    if: ${{ vars.AUREA_DEPLOY_ENABLED == 'true' }}
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ -n "$VERCEL_TOKEN" && -n "$VERCEL_ORG_ID" && -n "$VERCEL_PROJECT_ID" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Deploy frontend omitido: faltan credenciales de Vercel.'
          fi
      - name: Deploy to Vercel
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID"

  notify-image:
    name: Notify image
    if: ${{ always() && needs.publish.result != 'skipped' }}
    needs: [verify, publish]
    uses: aurea-io/aurea-ci/.github/workflows/notify.yml@7b42045
    with:
      event-type: image
      environment: production
      image: ghcr.io/aurea-io/backoffice-fe-aurea
      version: ${{ github.sha }}
      source-commit: ${{ github.sha }}
      status: ${{ needs.publish.result == 'success' && needs.verify.result == 'success' && 'success' || 'failure' }}
    secrets: inherit

  notify-deploy:
    name: Notify deploy
    if: ${{ always() && needs.deploy.result != 'skipped' }}
    needs: [publish, deploy]
    uses: aurea-io/aurea-ci/.github/workflows/notify.yml@7b42045
    with:
      event-type: deploy
      environment: production
      source-commit: ${{ github.sha }}
      status: ${{ needs.deploy.result == 'success' && 'success' || 'failure' }}
    secrets: inherit
